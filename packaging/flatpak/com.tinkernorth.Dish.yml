# Flatpak manifest for Dish.
#
#   flatpak install -y flathub org.kde.Platform//6.9 org.kde.Sdk//6.9
#   flatpak-builder --force-clean --user --install build-flatpak \
#     packaging/flatpak/com.tinkernorth.Dish.yml
#
# The KDE runtime, not freedesktop: it already carries Qt 6 (Base, Declarative,
# QuickControls2, Svg, Wayland), which is the whole reason a Flatpak is the
# answer on an LTS whose distro Qt is below this project's floor.
app-id: com.tinkernorth.Dish
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: dish

# The finish-stage sandbox has no network, and compose fetches the remote
# screenshot URLs the metainfo carries (remote is Flathub's own convention).
# A sideloaded bundle needs no composed catalog; Flathub's builder runs its
# own compose, with network, for the store listing. The flathub-variant
# manifest therefore leaves this on.
appstream-compose: false

finish-args:
  # --share=ipc is what makes the X11 fallback usable (MIT-SHM) rather than glacial.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # LAN discovery (UDP broadcast + mDNS), the pairing REST call and the
  # encrypted UDP session all need the host network.
  - --share=network

  # Controller audio: a claimed pad's own mic and speaker endpoints are
  # ordinary audio devices, reached through the session audio server. The
  # pulseaudio socket is the one grant that covers both stacks — on a PipeWire
  # desktop it is served by pipewire-pulse, so no pipewire-specific grant is
  # needed.
  - --socket=pulseaudio

  # SDL input needs /dev/input/event*; USB-direct needs O_RDWR on /dev/hidraw*,
  # which no narrower grant provides — there is no hidraw portal, and
  # org.freedesktop.portal.Usb covers raw USB devices, not hidraw character
  # devices. If a reviewer rejects this, ship --device=input alone: the SDL path
  # still works, USB-direct reports PermissionDenied, and the user can restore it
  # with `flatpak override --user --device=all com.tinkernorth.Dish`.
  - --device=all

  # Util/DisplaySleepInhibitor holds the screen awake through this name.
  - --talk-name=org.freedesktop.ScreenSaver
  # The tray item registers itself with the shell's watcher. Nothing is needed
  # for com.canonical.dbusmenu: that is an interface exported on our own
  # connection, which the host reaches through the unique name it already has.
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Dish is still running" has to reach a user whose window just vanished.
  - --talk-name=org.freedesktop.Notifications
  # BluetoothRadioProbe needs Adapter1.Powered to tell "no adapter" from "off".
  - --system-talk-name=org.bluez
  # Both logind locks: DisplaySleepInhibitor's idle block, and SleepMonitor's
  # sleep delay plus its PrepareForSleep subscription. Without this the sandbox
  # silently loses the suspend handling the host build has.
  - --system-talk-name=org.freedesktop.login1

  # No --filesystem: settings land in ~/.var/app/com.tinkernorth.Dish/config/.

modules:
  # Neither is in org.kde.Platform. Checksums verified against the release
  # tarballs; re-verify on every bump with `curl -sL <url> | sha256sum`.
  # (libopus needs no module: the freedesktop base runtime ships it and the
  # Sdk carries its headers, so the build's REQUIRED opus.pc check binds to
  # the runtime copy — and fails the build loudly if a runtime bump ever
  # drops it.)
  - name: libsodium
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
        sha256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'

  - name: sdl2
    buildsystem: cmake-ninja
    # SDL2's CMakeLists refuses an in-tree configure, which is the
    # cmake-ninja default; build out of tree.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TEST=OFF
      # Dish uses SDL for gamepads and for controller audio (the pad's own mic
      # and speaker endpoints); only the render backend is dead weight in the
      # sandbox. The audio backends auto-detect against the Sdk: pulse (served
      # by pipewire-pulse on PipeWire desktops) is the one the pulseaudio
      # socket grant reaches.
      - -DSDL_RENDER=OFF
      - -DSDL_AUDIO=ON
      - -DSDL_HIDAPI=ON
      - -DSDL_JOYSTICK=ON
      - -DSDL_HAPTIC=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
        sha256: 24b574f71c87a763f50704bbb630cbe38298d544a1f890f099a4696b1d6beba4
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /bin/sdl2-config
      - /share/aclocal
      - '*.la'

  - name: dish
    buildsystem: cmake-ninja
    # No builddir here: post-install copies the udev rule by a
    # source-relative path, and dish's CMake accepts an in-tree configure.
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDISH_BUILD_TESTS=OFF
      # A rule under /app is read by nothing; the app degrades to SDL and says so.
      - -DDISH_INSTALL_UDEV_RULES=OFF
    sources:
      - type: dir
        path: ../..
    post-install:
      # Carried so a user who wants USB-direct can install it on the host.
      - install -Dm644 packaging/udev/70-dish-hidraw.rules
        /app/share/dish/70-dish-hidraw.rules
