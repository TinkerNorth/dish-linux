name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded pull-request run is cancelled; a run on main never is, so every
# merge keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The artifact upload goes through the Actions API, not contents.
permissions:
  contents: read

# Every gate below is a script under scripts/ that scripts/ci-local.sh runs in
# the same order, so a green local run is a green run here. The ccache
# launcher comes from .github/actions/setup-build-deps, through CMake's
# environment variables rather than the presets, because a local box need not
# have ccache.

jobs:
  ci:
    name: Build, test, lint, format (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    # This job provisions Qt, builds ~285 sources twice, runs the suite twice
    # and sweeps clang-tidy over src/. An hour still catches a hung step; it
    # does not fail the build over a mirror having a bad afternoon.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      # -Werror has only ever been evaluated by gcc; -Wconversion, -Wshadow and
      # -Wold-style-cast all diverge materially between gcc and clang, and
      # clang-tidy reading the gcc compile database is not a substitute.
      DISH_LINTS: ${{ matrix.compiler == 'gcc' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: ci-${{ matrix.compiler }}
          extra-packages: clang

      # Not apt: noble ships Qt 6.4.2 and this project's floor is 6.7. The
      # action pulls the official binaries and exports CMAKE_PREFIX_PATH.
      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Set up Python
        if: env.DISH_LINTS == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The versions every C++ repo in the fleet pins (DISH_CLANG_FORMAT_VERSION
      # and DISH_CLANG_TIDY_VERSION in scripts/tools.sh), as PyPI wheels:
      # Ubuntu's own disagree on layout and on the checks.
      - name: Install clang-format and clang-tidy (pinned)
        if: env.DISH_LINTS == 'true'
        run: |
          set -euo pipefail
          source scripts/tools.sh
          pipx install "clang-format==${DISH_CLANG_FORMAT_VERSION}"
          pipx install "clang-tidy==${DISH_CLANG_TIDY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: clang-format (check only)
        if: env.DISH_LINTS == 'true'
        run: ./scripts/check-format.sh

      - name: Configure (Debug, tests on)
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --parallel

      # QT_QPA_PLATFORM=offscreen comes from the test preset: no display on
      # the runner, and the QML tests construct QGuiApplication.
      - name: Run tests (Debug)
        run: ctest --preset debug --parallel

      - name: qmllint (QML static analysis)
        if: env.DISH_LINTS == 'true'
        run: ./scripts/check-qml.sh

      # qmllint checks a QML file RESOLVES; this checks it used the design
      # tokens. A hard-coded `#4FE3FF` or `radius: 8` still renders, it just
      # stops tracking the palette, and no other gate would catch it.
      - name: QML literal scanner
        if: env.DISH_LINTS == 'true'
        run: ./scripts/qml-lint-literals.sh --mode error

      # A stale .ts is not a compile error, so nothing else catches a string
      # added without a catalogue entry.
      - name: Translation catalogues in sync
        if: env.DISH_LINTS == 'true'
        run: ./scripts/check-translations.sh

      - name: clang-tidy
        if: env.DISH_LINTS == 'true'
        run: ./scripts/check-tidy.sh

      # The input-path bench (tools/bench) builds here too, so ctest runs its
      # --smoke against the configuration that ships.
      - name: Configure (Release, tests on)
        run: cmake --preset release -DDISH_BUILD_BENCH=ON

      - name: Build release
        run: cmake --build --preset release --parallel

      # -O3 plus LTO is a different compiler: undefined behaviour that Debug
      # tolerates surfaces here.
      - name: Run tests (Release)
        run: ctest --preset release --parallel

      # measurements.yml turns the bench's JSON into a release's report; these
      # tests also read the JSON the smoke run above really wrote.
      - name: Measurements report tests
        if: env.DISH_LINTS == 'true'
        env:
          DISH_BENCH_JSON: build-release/tools/bench/bench_input_path_smoke.json
        run: python3 -m unittest discover -s tests -p 'test_measurements_report.py'

      - name: Assert hardening flags reached the binary
        if: env.DISH_LINTS == 'true'
        run: ./scripts/check-hardening.sh build-release/dish

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload release binary
        if: env.DISH_LINTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dish-linux-x86_64
          path: build-release/dish
          retention-days: 14

  sanitize:
    name: Sanitizers (${{ matrix.san }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # thread is not optional here: the app runs long-lived threads (the
        # SDL bridge, the socket loops, the hidraw reader) over shared atomics
        # and mutexes, and nothing else in the pipeline would see a race.
        san: ["address+undefined", "thread"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: san-${{ matrix.san }}

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build and run the suite under the sanitizer
        env:
          SAN: ${{ matrix.san }}
        run: ./scripts/sanitize.sh "$SAN"

  # The lock-law ratchet (tests/test_lock_laws.cpp) and the statistics half of
  # tests/test_tracked_mutex.cpp exist only in a DISH_LOCK_STATS build, which no
  # other lane configures and no package ships.
  lock-stats:
    name: Lock statistics and the lock laws
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: lockstats

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build and run the lock-statistics suite
        run: ./scripts/lock-stats.sh

  # The lock laws drive every hot-path thread at once over the real objects
  # (tests/HotPathRig.h, which the bench shares), as no plain-build test does,
  # so they run under each sanitizer as well.
  lock-laws-sanitize:
    name: Lock laws under sanitizers (${{ matrix.san }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        san: ["address+undefined", "thread"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: lockstats-san-${{ matrix.san }}

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build and run the lock laws under the sanitizer
        env:
          SAN: ${{ matrix.san }}
        run: ./scripts/sanitize.sh "$SAN" lock-laws

  package:
    name: Package (.deb) and launch it
    runs-on: ubuntu-24.04
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    # Debian 13's Qt is 6.8, above the 6.7 floor, and dpkg-shlibdeps must read a
    # binary linked against the Qt the package will resolve against. Ubuntu
    # 24.04 LTS is deliberately not a .deb target: its Qt is 6.4.2. The tag is
    # the one scripts/tools.sh names (DISH_DEB_IMAGE), which
    # scripts/package-in-container.sh runs locally.
    container: debian:13.7
    timeout-minutes: 45
    steps:
      # The image has no git, so this checkout comes through the REST API;
      # nothing below reads the history.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: ./scripts/package-deps.sh deb

      # Configure + build + cpack live in scripts/build-deb.sh (the `package`
      # preset), the same path release.yml's deb job runs.
      - name: Build the .deb
        run: ./scripts/build-deb.sh

      # Desktop entry and AppStream validation, lintian, the payload, then the
      # install and launch: scripts/test-package.sh, as release.yml runs it.
      - name: Check, install and launch the .deb
        run: ./scripts/test-package.sh deb

      # Named as release.yml's deb job names its upload, so the release-dry-run
      # job below hardens what a tag would.
      - name: Upload the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 14

  # The .rpm twin of the package job, through the same scripts release.yml's
  # rpm job runs: until this job existed the rpm path ran for the first time on
  # a public tag, which is how 2.8.0's empty Fedora launch log was found.
  rpm:
    name: Package (.rpm) and launch it
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    # Fedora's own Qt, for the same reason as the .deb: rpmbuild's soname
    # scanner writes the Requires against the Qt the package will resolve.
    # DISH_RPM_IMAGE in scripts/tools.sh.
    container: fedora:44
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: ./scripts/package-deps.sh rpm

      # No DSN here, so the Sentry SDK is neither fetched nor built.
      - name: Build the .rpm
        run: ./scripts/build-rpm.sh

      # The payload, the udev reload scriptlet, then the install and launch.
      - name: Check, install and launch the .rpm
        run: ./scripts/test-package.sh rpm

      # release.yml signs the .rpm with the repository key; this signs a copy
      # with a throwaway key through the same script and has rpm verify it.
      - name: Sign a copy of the .rpm as the release does
        run: ./scripts/check-rpm-signing.sh dist/dish-[0-9]*.rpm

      - name: Upload the .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm
          path: dist/*.rpm
          retention-days: 14

  # release.yml's apt-publish and rpm-publish run only on a stable tag, and a
  # tag is too late to learn that one of them no longer works (a release was
  # lost to exactly that on 2026-11-23). This builds both repositories from the
  # two packages above through the same scripts, on the runner the publish
  # jobs use, signs them with a throwaway key, reads them back, and installs
  # and launches dish from each in a clean container, as a user would.
  # Nothing is published.
  repos:
    name: APT and DNF repositories (built, not published)
    needs: [package, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository tools
        run: sudo ./scripts/package-deps.sh repos

      - name: Download the .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-deb
          path: staging

      - name: Download the .rpm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-rpm
          path: staging

      - name: Build and read back the repositories
        run: ./scripts/check-package-repos.sh staging

      # What a user does: add the repository as packaging/repo/README.md says,
      # install dish with apt and with dnf (gpgcheck on), and launch it, each
      # in a clean Debian or Fedora container.
      - name: Install and launch from each repository
        run: ./scripts/install-from-repos.sh dist/pages

  # The pull-request run of release.yml's harden job: the shared
  # _release_harden.yml in dry-run mode over the two packages above, so the
  # Grype scan, the SBOMs, SHA256SUMS and the signing and verifying loop run
  # before a tag needs them. Signing uses a key made in the run and nothing
  # leaves the runner. What it cannot exercise: Fulcio, Rekor and the keyless
  # identity (no id-token on a pull request), the code-scanning SARIF upload,
  # and the SLSA generator (it needs id-token and a tag).
  release-dry-run:
    name: Release hardening (dry run)
    needs: [package, rpm]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: linux-*
      product: dish
      dry-run: true

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: coverage
          extra-packages: lcov

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build, run and report
        run: |
          set -euo pipefail
          ./scripts/coverage.sh | tee coverage-summary.txt
          {
            echo '### Coverage'
            echo '```'
            sed -n '/^Summary coverage rate/,$p' coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: cov.info
          retention-days: 14

  # The SDK is only fetched and built when a DSN is present, which no PR
  # build has, so this is the one lane that compiles and links the Sentry
  # path before a release tag does. The DSN resolves nowhere; nothing runs it.
  sentry-sdk:
    name: Build with the Sentry SDK (dummy DSN)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          cache-key: ci-sentry
          extra-packages: libcurl4-openssl-dev

      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build and check the Sentry build
        run: ./scripts/check-sentry-build.sh
