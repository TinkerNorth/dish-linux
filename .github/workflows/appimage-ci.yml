name: AppImage CI

#
# The bundle release.yml ships, and the dish-bin pacman package built from it,
# on every pull request. The release lane is the only other place either
# script runs, and a tag is a late place to learn that the Qt it now pins lays
# its plugins out differently or that the PKGBUILD no longer builds. Not
# path-filtered: what feeds the bundle is most of the tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  appimage:
    name: Build the AppImage and run its smoke test
    # jammy, as release.yml: the bundle's glibc floor is the build host's.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the AppImage build host
        uses: ./.github/actions/setup-appimage-host

      # No DSN, as a hand-run: the bundle cannot transmit and the SDK is not
      # fetched. The script's own gates run either way: every platform plugin
      # by name, then the offscreen smoke test of the unpacked artifact.
      - name: Build AppImage
        run: scripts/build-appimage.sh

      # The bill of materials of what the packages carry, from this build and
      # the pins, the document release.yml ships beside the AppImage; checked
      # against the libraries the Licenses screen lists.
      - name: Write and check the components SBOM
        run: |
          set -euo pipefail
          scripts/write-sbom.sh build-appimage/AppDir dist/dish-linux-components.spdx.json
          scripts/check-sbom.sh dist/dish-linux-components.spdx.json

      # The platform plugins that went into the bundle, in the log, so a
      # failure of the script's name check comes with the whole list.
      - name: List the bundled platform plugins
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -name 'Dish-*-x86_64.AppImage' -print -quit)"
          [ -n "${appimage}" ] || { echo "::error::no AppImage in dist/"; exit 1; }
          (cd "${RUNNER_TEMP}" && "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract 'usr/plugins/platforms/*' >/dev/null)
          ls -l "${RUNNER_TEMP}/squashfs-root/usr/plugins/platforms/"
          compgen -G "${RUNNER_TEMP}/squashfs-root/usr/plugins/platforms/libqwayland*.so" >/dev/null \
            || { echo "::error::the bundle carries no Wayland platform plugin"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage-ci
          path: |
            dist/*.AppImage
            dist/dish-linux-components.spdx.json
          retention-days: 7
          if-no-files-found: error

  # The pull-request rehearsal of release.yml's arch-publish job: the same
  # PKGBUILD through scripts/build-arch-package.sh, from this tree and the
  # AppImage above, a pacman repository signed with a throwaway key through
  # packaging/repo/build-pacman-repo.sh, and pacman installing dish-bin from
  # it with signature checking on. Nothing is published.
  arch:
    name: Build the dish-bin package and its pacman repository
    needs: [appimage]
    runs-on: ubuntu-24.04
    # DISH_ARCH_IMAGE in scripts/tools.sh, the tag release.yml's arch-publish uses.
    container: archlinux:base-devel-20261108.0.623074
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tooling
        run: ./scripts/package-deps.sh arch

      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-appimage-ci
          path: appimage

      - name: Build, sign, serve and install dish-bin
        run: |
          set -euo pipefail
          appimage="$(find appimage -maxdepth 1 -name 'Dish-*-x86_64.AppImage' -print -quit)"
          [ -n "${appimage}" ] || { echo "::error::no AppImage downloaded"; exit 1; }
          ./scripts/check-arch-package.sh "${appimage}"

  # The shared hardening in dry-run mode over the AppImage and the components
  # SBOM, as release.yml's harden job runs over them: Syft folds the SBOM into
  # the product one and Grype scans the result. Throwaway key, nothing leaves
  # the runner.
  release-dry-run:
    name: Release hardening (dry run)
    needs: [appimage]
    permissions:
      contents: read
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: linux-appimage-ci
      product: dish
      dry-run: true
