name: Version consistency

# A PR-time text gate, not a build: scripts/check-version-consistency.sh, which
# scripts/ci-local.sh runs first. The version has one source,
# project(Dish VERSION ...) in CMakeLists.txt, mirrored into the AppStream
# <release> and the CHANGELOG heading; the Qt and SDL2 floors, the Qt,
# SDL2, sentry-native and KDE runtime pins, the container images, the
# clang-format version and the protocol number each have one source too, and
# the script fails the pull request that moves one copy without the others.
# release.yml keeps its own tag check: only it can compare the git tag against
# the tree. Not path-filtered: the copies live in a dozen files across the
# tree, and the check takes seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Version mirrors and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every copy with its source
        run: ./scripts/check-version-consistency.sh
