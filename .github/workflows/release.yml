name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Packages a tagged commit four ways — .deb (Debian 13+), .rpm (Fedora/RHEL/
# openSUSE), AppImage (everything else, including an LTS whose Qt is below the
# floor) and a Flatpak bundle — emits the latest.json the in-app update check
# reads, and uploads the lot to the GitHub Releases page for the tag.
#
# The .deb and .rpm jobs install their own package and launch it before
# uploading. That is the only gate that can catch a missing runtime dependency:
# every other check passes against a build tree, which is exactly where a QML
# module resolves from the Qt install instead of from a Depends: line.
#
# Before any artifact is uploaded the `gates` job re-runs every PR-time
# check (action-pin lint, allowlist expiry, OSV-Scanner, gitleaks)
# against the tagged commit. The `harden` job then scans, signs (cosign
# keyless), generates SBOMs, and produces SHA256SUMS.
#
# Linux binaries are not signed with a platform key by default; the
# `required-secrets` gate therefore enforces only that the cosign keyless
# flow is reachable (id-token: write).
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   anchore/sbom-action             @ v0.24.0 → e22c389904149dbc22b58101806040fa8d37a610
#   anchore/scan-action             @ v7.4.0  → e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
#   github/codeql-action/upload-sarif @ v4.35.4 → 68bde559dea0fdcac2102bfdf6230c5f70eb485e
#   softprops/action-gh-release     @ v3.0.0  → b4309332981a82ec1c5618f44dd2e27cc8bfbfda
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a

# Least privilege at the top; each job widens only what it needs. A workflow
# grant is a ceiling for the jobs AND for any reusable workflow they call, so
# `contents: write` here would have left `gates` unable to request the
# security-events scope _security.yml declares.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # Must be a superset of _security.yml's own permissions block: a called
    # workflow asking for more than the caller holds fails the run outright.
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Verify cosign keyless OIDC is reachable for tagged releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            echo "::notice::Non-tag release run — cosign keyless gate is advisory."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::id-token: write permission missing — cosign keyless signing cannot proceed."
            exit 1
          fi
          echo "id-token write permission present; cosign keyless flow can authenticate."

  # =========================================================================
  # .deb — Debian 13 and derivatives.
  #
  # In a debian:trixie container against the DISTRO's Qt (6.8, above the 6.7
  # floor), not the aqtinstall Qt the other jobs use: dpkg-shlibdeps reads the
  # built binary's DT_NEEDED set to compute Depends, and a binary linked
  # against a Qt no Debian ships produces a package that resolves on nothing.
  # Ubuntu 24.04 LTS is deliberately not a .deb target — its Qt is 6.4.2, below
  # the floor. The AppImage and the Flatpak are the answer there.
  # =========================================================================
  deb:
    name: Build .deb (Debian 13)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          cat > /etc/apt/apt.conf.d/99-dish-acquire <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
          CONF
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libsodium-dev libsdl2-dev libdbus-1-dev \
            dpkg-dev fakeroot file gzip \
            librsvg2-bin desktop-file-utils appstream lintian

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate desktop entry and AppStream metadata
        run: |
          set -euo pipefail
          desktop-file-validate packaging/dish.desktop
          appstreamcli validate --no-net packaging/com.tinkernorth.Dish.metainfo.xml

      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDISH_BUILD_TESTS=OFF
          cmake --build build-release --parallel

      - name: Package
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -G DEB -B build-release/packages
          mkdir -p dist && cp build-release/packages/*.deb dist/

      - name: lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Assert package contents
        run: |
          set -euo pipefail
          contents="$(dpkg-deb -c dist/*.deb)"
          for path in \
            ./usr/bin/dish \
            ./usr/lib/udev/rules.d/70-dish-hidraw.rules \
            ./usr/share/applications/com.tinkernorth.Dish.desktop \
            ./usr/share/metainfo/com.tinkernorth.Dish.metainfo.xml \
            ./usr/share/icons/hicolor/scalable/apps/com.tinkernorth.Dish.svg \
            ./usr/share/doc/dish/copyright
          do
            grep -qE " ${path}\$" <<<"${contents}" \
              || { echo "::error::${path} missing from the .deb"; exit 1; }
          done
          icon="$(sed -n 's/^Icon=//p' packaging/dish.desktop)"
          grep -q "/apps/${icon}\." <<<"${contents}" \
            || { echo "::error::Icon=${icon} names no installed icon"; exit 1; }

      # Nothing else can stand in for this. Unit tests, lints and a contents
      # check all pass against a build tree, and a build tree is exactly what
      # hides a missing runtime dependency: a QML module resolves from the Qt
      # install during development and from a Depends: line afterwards.
      - name: Install the package and launch it
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          export QT_QPA_PLATFORM=offscreen
          export XDG_RUNTIME_DIR=/tmp/dish-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          # The SVG handler is a run-time plugin, so its absence shows up as
          # "Unsupported image format" per glyph rather than as a link error.
          echo "--- Qt image-format plugins ---"
          ls -1 /usr/lib/*/qt6/plugins/imageformats/ 2>/dev/null || echo "(no imageformats directory)"
          dpkg -S /usr/lib/*/qt6/plugins/imageformats/libqsvg.so 2>/dev/null \
            || echo "libqsvg.so is absent — no package here provides it"
          set +e
          # -k is load-bearing: plain `timeout` sends TERM and then waits
          # forever if the child does not die, which is how this step once sat
          # for 40 minutes and took the job's timeout with it. The follow-up
          # KILL can be neither blocked nor handled.
          timeout -k 10 25 dish >/tmp/launch.log 2>&1
          rc=$?
          set -e
          cat /tmp/launch.log
          if grep -qE 'is not installed|failed to load component|Cannot load library|no such file' /tmp/launch.log; then
            echo "::error::the installed package cannot load its Qt/QML runtime"
            exit 1
          fi
          # Not fatal yet, but the app renders no iconography at all when this
          # fires, and a log flood is easy to miss. Surfaced until it is fixed.
          if grep -q 'Error decoding:' /tmp/launch.log; then
            echo "::warning::the installed app cannot decode its brand SVGs — the Qt SVG image plugin is missing or unloadable"
          fi
          # Staying up past the deadline is the pass: 124 means it took the
          # TERM, 137 means it needed the KILL.
          case "$rc" in
            124) ;;
            137) echo "::warning::dish did not exit on SIGTERM; it needed SIGKILL" ;;
            # >=128 is death by signal, i.e. it did not stay up. Not a hard
            # failure yet — a container has no GPU and no bus, so the cause may
            # be environmental — but it must not read as routine.
            1[3-9][0-9]|12[0-3]) echo "::warning::dish died on signal $((rc - 128)) during startup" ;;
            *) echo "::notice::dish exited ${rc} without a loader error" ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  # =========================================================================
  # .rpm — Fedora, RHEL and openSUSE. Same reasoning as the .deb: build where
  # the Qt comes from, and let rpmbuild's soname scanner write the Requires.
  # =========================================================================
  rpm:
    name: Build .rpm (Fedora)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 45
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          dnf -y install --setopt=install_weak_deps=False \
            git-core ca-certificates \
            gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel qt6-qttools-devel \
            libsodium-devel SDL2-devel dbus-devel \
            librsvg2-tools desktop-file-utils libappstream-glib gzip

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDISH_BUILD_TESTS=OFF
          cmake --build build-release --parallel

      - name: Package
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -G RPM -B build-release/packages
          mkdir -p dist && cp build-release/packages/*.rpm dist/

      - name: Assert package contents and scriptlets
        run: |
          set -euo pipefail
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm
          # Without the reload a pad plugged in before the install keeps its
          # root-only node and every USB-direct claim fails.
          rpm -qp --scripts dist/*.rpm | grep -q 'udevadm control' \
            || { echo "::error::rpm carries no udev reload scriptlet"; exit 1; }
          rpm -qlp dist/*.rpm | grep -qx '/usr/lib/udev/rules.d/70-dish-hidraw.rules' \
            || { echo "::error::udev rule missing or at the wrong path"; exit 1; }

      - name: Install the package and launch it
        run: |
          set -euo pipefail
          dnf -y install ./dist/*.rpm
          export QT_QPA_PLATFORM=offscreen
          export XDG_RUNTIME_DIR=/tmp/dish-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          # The SVG handler is a run-time plugin, so its absence shows up as
          # "Unsupported image format" per glyph rather than as a link error.
          echo "--- Qt image-format plugins ---"
          ls -1 /usr/lib/*/qt6/plugins/imageformats/ 2>/dev/null || echo "(no imageformats directory)"
          dpkg -S /usr/lib/*/qt6/plugins/imageformats/libqsvg.so 2>/dev/null \
            || echo "libqsvg.so is absent — no package here provides it"
          set +e
          # -k is load-bearing: plain `timeout` sends TERM and then waits
          # forever if the child does not die, which is how this step once sat
          # for 40 minutes and took the job's timeout with it. The follow-up
          # KILL can be neither blocked nor handled.
          timeout -k 10 25 dish >/tmp/launch.log 2>&1
          rc=$?
          set -e
          cat /tmp/launch.log
          if grep -qE 'is not installed|failed to load component|Cannot load library|no such file' /tmp/launch.log; then
            echo "::error::the installed package cannot load its Qt/QML runtime"
            exit 1
          fi
          # Not fatal yet, but the app renders no iconography at all when this
          # fires, and a log flood is easy to miss. Surfaced until it is fixed.
          if grep -q 'Error decoding:' /tmp/launch.log; then
            echo "::warning::the installed app cannot decode its brand SVGs — the Qt SVG image plugin is missing or unloadable"
          fi
          # Staying up past the deadline is the pass: 124 means it took the
          # TERM, 137 means it needed the KILL.
          case "$rc" in
            124) ;;
            137) echo "::warning::dish did not exit on SIGTERM; it needed SIGKILL" ;;
            # >=128 is death by signal, i.e. it did not stay up. Not a hard
            # failure yet — a container has no GPU and no bus, so the cause may
            # be environmental — but it must not read as routine.
            1[3-9][0-9]|12[0-3]) echo "::warning::dish died on signal $((rc - 128)) during startup" ;;
            *) echo "::notice::dish exited ${rc} without a loader error" ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # AppImage — every other distro, including the LTS whose Qt is too old.
  # ubuntu-22.04, not 24.04: an AppImage's floor is the glibc it linked
  # against, and 22.04's 2.35 covers every currently-supported desktop.
  # =========================================================================
  appimage:
    name: Build AppImage
    needs: [gates, required-secrets]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          set -eux
          sudo tee /etc/apt/apt.conf.d/99-dish-acquire >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
          CONF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsodium-dev libsdl2-dev \
            file fakeroot rsync wget curl librsvg2-bin gzip

      # Not apt: jammy ships Qt 6.2 and this project's floor is 6.7. The action
      # pulls the official binaries, exports CMAKE_PREFIX_PATH, and puts qmake
      # on PATH where linuxdeploy-plugin-qt looks for it.
      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      # Everything fiddly — QML_SOURCES_PATHS, the icon basename, the offscreen
      # smoke test — lives in the script so a local build and CI agree.
      - name: Build AppImage
        run: scripts/build-appimage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  # =========================================================================
  # Flatpak — the sandboxed build, and the artifact a Flathub PR is validated
  # against. flatpak-builder is driven directly so there is one fewer
  # third-party action to pin and audit.
  # =========================================================================
  flatpak:
    name: Build Flatpak bundle
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install flatpak-builder
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder ca-certificates
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stage version
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and export bundle
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --repo=build-flatpak/repo build-flatpak/build \
            packaging/flatpak/com.tinkernorth.Dish.yml
          mkdir -p dist
          flatpak build-bundle build-flatpak/repo \
            "dist/Dish-${{ steps.ver.outputs.version }}-x86_64.flatpak" \
            com.tinkernorth.Dish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # =========================================================================
  # latest.json — the update manifest.
  #
  # core/update/UpdateManifest.h fetches releases/latest/download/latest.json
  # and rejects anything whose product is not "dish-linux", whose channel is
  # not "stable", or whose minimumSupportedVersion is malformed or newer than
  # its version. This job is the only producer; the asset name never changes.
  # Without it the in-app update check 404s forever.
  # =========================================================================
  manifest:
    name: Emit update manifest
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Write latest.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '${TAG}' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

          # The drift that breaks every client at once: a manifest naming a
          # version the shipped binary does not report. DISH_VERSION comes from
          # project(Dish VERSION ...), so checking CMakeLists checks the binary.
          project_version="$(awk '/^project\(Dish/ { inproj = 1 }
                                  inproj && /^[[:space:]]*VERSION[[:space:]]/ { print $2; exit }' CMakeLists.txt)"
          [ "${project_version}" = "${version}" ] \
            || { echo "::error::tag ${TAG} but project(Dish VERSION) is ${project_version}"; exit 1; }

          min="$(python3 -c 'import json;print(json.load(open("packaging/update-policy.json"))["minimumSupportedVersion"])')"

          mkdir -p dist
          python3 - "$version" "$min" "$REPO" "$TAG" > dist/latest.json <<'PY'
          import json, sys, datetime
          version, minimum, repo, tag = sys.argv[1:5]
          print(json.dumps({
              "schema": 1,
              "product": "dish-linux",
              "version": version,
              "channel": "stable",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                                 .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "minimumSupportedVersion": minimum,
              "releaseNotesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
          }, indent=2))
          PY
          cat dist/latest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-manifest
          path: dist/latest.json
          if-no-files-found: error

  harden:
    name: Harden artifacts (scan, SBOM, sign)
    needs: [deb, rpm, appimage, flatpak, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          merge-multiple: true
          path: release

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          path: release/
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          add-cpes-if-none: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: release-grype

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/
          format: spdx-json
          output-file: release/dish.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/
          format: cyclonedx-json
          output-file: release/dish.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign (upstream binary)
        shell: bash
        env:
          COSIGN_VERSION: "2.4.1"
          # Pin upstream SHA-256 of cosign-linux-amd64. Verify with:
          #   gh release view v${COSIGN_VERSION} -R sigstore/cosign --json assets
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b" # cosign-linux-amd64 v2.4.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          if [ "${COSIGN_SHA256}" != "TODO_REPLACE_WITH_UPSTREAM_SHA256" ]; then
            echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          else
            echo "::warning::COSIGN_SHA256 is unset — replace with the upstream SHA-256 to enforce binary integrity."
          fi
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -d '\n' sha256sum --binary > SHA256SUMS
          cat SHA256SUMS

      - name: Cosign-sign each artifact + SHA256SUMS (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            case "$f" in
              *.sig|*.crt|SHA256SUMS.sig|SHA256SUMS.crt) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done
          ls -l

      - name: Compute base64 SHA256 hashes for SLSA provenance
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          h=$(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.crt' \
                  -printf '%f\n' \
                | LC_ALL=C sort \
                | xargs -d '\n' sha256sum \
                | base64 -w0)
          echo "hashes=${h}" >> "$GITHUB_OUTPUT"

      - name: Upload hardened bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          retention-days: 14

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-linux.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/**/*
