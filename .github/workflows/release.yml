name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Builds a release binary, packages it as both a .deb (for Debian / Ubuntu /
# derivatives) and a self-contained AppImage (for every other distro), and
# uploads both to the GitHub Releases page for the tag.
#
# Before any artifact is uploaded the `gates` job re-runs every PR-time
# check (action-pin lint, allowlist expiry, OSV-Scanner, gitleaks)
# against the tagged commit. The `harden` job then scans, signs (cosign
# keyless), generates SBOMs, and produces SHA256SUMS.
#
# Linux binaries are not signed with a platform key by default; the
# `required-secrets` gate therefore enforces only that the cosign keyless
# flow is reachable (id-token: write).
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v6.0.2  → de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   anchore/sbom-action             @ v0.24.0 → e22c389904149dbc22b58101806040fa8d37a610
#   anchore/scan-action             @ v7.4.0  → e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
#   github/codeql-action/upload-sarif @ v3.27.0 → 662472033e021d55d94146f66f6058822b0b39fd
#   softprops/action-gh-release     @ v3.0.0  → b4309332981a82ec1c5618f44dd2e27cc8bfbfda
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify cosign keyless OIDC is reachable for tagged releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            echo "::notice::Non-tag release run — cosign keyless gate is advisory."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::id-token: write permission missing — cosign keyless signing cannot proceed."
            exit 1
          fi
          echo "id-token write permission present; cosign keyless flow can authenticate."

  release:
    name: Build Linux .deb + AppImage
    needs: [gates, required-secrets]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          # A mirror that stops answering should cost seconds, not minutes:
          # azure.archive.ubuntu.com went dark mid-afternoon and apt sat on it
          # for 2-6 minutes per index before failing over to archive.ubuntu.com,
          # which is what blew this job's timeout. Bound the wait; apt still
          # reaches the working mirror, just sooner.
          sudo tee /etc/apt/apt.conf.d/99-dish-acquire >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
          CONF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsodium-dev libsdl2-dev \
            file fakeroot rsync wget

      # Not apt: jammy ships Qt 6.2 and this project's floor is 6.7. The action
      # pulls the official binaries, exports CMAKE_PREFIX_PATH, and puts qmake
      # on PATH where linuxdeploy-plugin-qt looks for it.
      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      - name: Build release
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISH_BUILD_TESTS=OFF
          cmake --build build-release --parallel --target Dish
          install -Dm755 build-release/dish dist/usr/bin/dish
          install -Dm644 packaging/dish.desktop dist/usr/share/applications/dish.desktop

      - name: Stage version
        id: ver
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          version="${tag#v}"
          echo "tag=${tag}"        >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          pkg="${RUNNER_TEMP}/dish-deb"
          mkdir -p "${pkg}/DEBIAN" "${pkg}/usr/bin" "${pkg}/usr/share/applications"

          # The Qt Quick port dropped Widgets and added Qml/Quick/Controls2, and
          # a binary linked against the Qt from .github/actions/setup-qt needs at
          # least that Qt to load. Read the floor back off the build instead of
          # writing the version down a second time.
          qt_floor="$(qmake -query QT_VERSION | cut -d. -f1,2)"
          atleast="(>= ${qt_floor})"
          depends="libqt6core6t64 ${atleast}, libqt6gui6t64 ${atleast}"
          depends="${depends}, libqt6network6t64 ${atleast}, libqt6dbus6t64 ${atleast}"
          depends="${depends}, libqt6opengl6t64 ${atleast}, libqt6svg6 ${atleast}"
          depends="${depends}, libqt6qml6 ${atleast}, libqt6quick6 ${atleast}"
          depends="${depends}, libqt6quickcontrols2-6 ${atleast}"
          depends="${depends}, libsodium23, libsdl2-2.0-0"
          cp dist/usr/bin/dish "${pkg}/usr/bin/"
          cp dist/usr/share/applications/dish.desktop "${pkg}/usr/share/applications/"
          cat > "${pkg}/DEBIAN/control" <<EOF
          Package: dish
          Version: ${{ steps.ver.outputs.version }}
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: ${depends}
          Maintainer: TinkerNorth <noreply@tinkernorth.invalid>
          Description: Wireless gamepad client for the Satellite server.
           Streams local SDL gamepad input to a Satellite server over an
           encrypted UDP channel. Mirrors the Android and macOS clients.
          EOF
          fakeroot dpkg-deb --build "${pkg}" "dist/dish_${{ steps.ver.outputs.version }}_amd64.deb"

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          appdir="${RUNNER_TEMP}/Dish.AppDir"
          mkdir -p "${appdir}"
          ./linuxdeploy --appdir "${appdir}" \
            --executable build-release/dish \
            --desktop-file packaging/dish.desktop \
            --plugin qt \
            --output appimage
          mv Dish*.AppImage "dist/dish-${{ steps.ver.outputs.version }}-x86_64.AppImage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage

  harden:
    name: Harden artifacts (scan, SBOM, sign)
    needs: [release]
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: release

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          path: release/
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          add-cpes-if-none: true
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: release-grype

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/
          format: spdx-json
          output-file: release/dish.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/
          format: cyclonedx-json
          output-file: release/dish.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign (upstream binary)
        shell: bash
        env:
          COSIGN_VERSION: "2.4.1"
          # Pin upstream SHA-256 of cosign-linux-amd64. Verify with:
          #   gh release view v${COSIGN_VERSION} -R sigstore/cosign --json assets
          COSIGN_SHA256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b" # cosign-linux-amd64 v2.4.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          if [ "${COSIGN_SHA256}" != "TODO_REPLACE_WITH_UPSTREAM_SHA256" ]; then
            echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          else
            echo "::warning::COSIGN_SHA256 is unset — replace with the upstream SHA-256 to enforce binary integrity."
          fi
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -d '\n' sha256sum --binary > SHA256SUMS
          cat SHA256SUMS

      - name: Cosign-sign each artifact + SHA256SUMS (keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            case "$f" in
              *.sig|*.crt|SHA256SUMS.sig|SHA256SUMS.crt) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done
          ls -l

      - name: Compute base64 SHA256 hashes for SLSA provenance
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          h=$(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.crt' \
                  -printf '%f\n' \
                | LC_ALL=C sort \
                | xargs -d '\n' sha256sum \
                | base64 -w0)
          echo "hashes=${h}" >> "$GITHUB_OUTPUT"

      - name: Upload hardened bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          retention-days: 14

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-linux.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/**/*
