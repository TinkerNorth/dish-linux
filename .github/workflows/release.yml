name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH tags, no v prefix: the fleet convention. A
    # prerelease (1.2.3-rc.1) matches too and publishes as a prerelease.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true
        type: string

# Packages a tagged commit four ways — .deb (Debian 13+), .rpm (Fedora/RHEL/
# openSUSE), AppImage (everything else, including an LTS whose Qt is below the
# floor) and a Flatpak bundle — emits the latest.json the in-app update check
# reads, and uploads the lot to the GitHub Releases page for the tag. Stable
# tags then regenerate the GPG-signed APT and DNF repositories on gh-pages
# (tinkernorth.github.io/dish-linux) so package managers pull the update.
#
# The .deb and .rpm jobs install their own package and launch it before
# uploading. That is the only gate that can catch a missing runtime dependency:
# every other check passes against a build tree, which is exactly where a QML
# module resolves from the Qt install instead of from a Depends: line.
#
# Before any artifact is uploaded the `gates` job re-runs every PR-time
# check (action-pin lint, allowlist expiry, OSV-Scanner, gitleaks)
# against the tagged commit. The `harden` job (the shared
# _release_harden.yml) then scans, signs (cosign keyless), generates SBOMs,
# and produces SHA256SUMS.
#
# The release is uploaded as a DRAFT and flipped to published afterwards:
# GitHub never points releases/latest at a draft, so the update permalink
# (latest.json) and the AppImage's zsync pattern both keep resolving to the
# previous release until every asset of the new one is in place. Between the
# two, measurements.yml runs the input-path bench on the tagged commit and
# attaches measurements-<version>.md and .json to the draft, so every release
# carries the numbers the next one is compared with.
#
# Prerelease tags (1.2.3-rc.1) publish marked as prerelease, skip
# latest.json, and skip the APT/DNF repos; stable clients and repos never
# see them.
#
# Alongside each versioned artifact, every package job stages a second copy
# under a version-less STABLE NAME:
#
#   dish-amd64.deb   dish-x86_64.rpm   Dish-x86_64.AppImage   Dish-x86_64.flatpak
#
# Those names are a permanent API, like dish-windows' dish-setup.exe and
# latest.json: releases/latest/download/<name> always resolves to the newest
# published build, so download pages can link "the latest build" without
# being rebuilt per release. Renaming or dropping one silently breaks every
# consumer of that permalink. The stable copies flow through the same harden
# job, so SHA256SUMS and the cosign signatures cover them too.
#
# Linux binaries are not signed with a platform key by default; the
# `required-secrets` gate therefore enforces only that the cosign keyless
# flow is reachable (id-token: write).
#
#   (scan/SBOM/cosign pins live in _release_harden.yml)

# Least privilege at the top; each job widens only what it needs. A workflow
# grant is a ceiling for the jobs AND for any reusable workflow they call, so
# `contents: write` here would have left `gates` unable to request the
# security-events scope _security.yml declares.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # Exactly what _security.yml declares: a called workflow asking for more
    # than the caller holds fails the run outright.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      # The same inputs as security.yml, with the same reasons.
      osv_lockfile_script: scripts/osv-lockfile.sh
      dependency_review_enabled: false

  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Verify cosign keyless OIDC is reachable for tagged releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::Non-release-tag run; cosign keyless gate is advisory."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::id-token: write permission missing — cosign keyless signing cannot proceed."
            exit 1
          fi
          echo "id-token write permission present; cosign keyless flow can authenticate."

      - name: Report APT/DNF repo signing readiness (advisory)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; the apt-publish and rpm-publish jobs will skip, and package-manager users will not see this release."
          else
            echo "GPG repo-signing secrets present; APT/DNF repos will be regenerated."
          fi

      - name: Report crash-reporting readiness (advisory)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning::SENTRY_DSN not set; this release builds with no DSN, skips the SDK and uploads no crash reports."
          else
            echo "SENTRY_DSN present; release builds carry the DSN."
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not set; debug symbols will not be uploaded and native frames stay unsymbolicated."
          else
            echo "SENTRY_AUTH_TOKEN present; debug symbols will be uploaded."
          fi

  # =========================================================================
  # .deb — Debian 13 and derivatives.
  #
  # In a debian:trixie container against the DISTRO's Qt (6.8, above the 6.7
  # floor), not the aqtinstall Qt the other jobs use: dpkg-shlibdeps reads the
  # built binary's DT_NEEDED set to compute Depends, and a binary linked
  # against a Qt no Debian ships produces a package that resolves on nothing.
  # Ubuntu 24.04 LTS is deliberately not a .deb target — its Qt is 6.4.2, below
  # the floor. The AppImage and the Flatpak are the answer there.
  # =========================================================================
  deb:
    name: Build .deb (Debian 13)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    # DISH_DEB_IMAGE in scripts/tools.sh, the tag linux-ci.yml's package job uses.
    container: debian:13.7
    timeout-minutes: 45
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      # The image has no git, so this checkout comes through the REST API.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: ./scripts/package-deps.sh deb

      # Configure + build + cpack live in scripts/build-deb.sh (the `package`
      # preset), the same path linux-ci.yml's package job runs.
      - name: Build the .deb
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN, cannot upload,
          # and skips building the SDK entirely.
          DISH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./scripts/build-deb.sh

      # Best effort: a symbol-upload hiccup must not fail a release.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/sentry-cli.sh symbols build-package

      # Metadata, lintian, payload, install and launch: the script
      # linux-ci.yml's package job runs.
      - name: Check, install and launch the .deb
        run: ./scripts/test-package.sh deb

      # Stable-name copy for the /releases/latest/download/ permalink; the
      # dash (vs the versioned name's underscores) keeps it clear of the
      # dish_*_amd64.deb glob.
      - name: Stage stable-name alias
        run: cp dist/dish_*_amd64.deb dist/dish-amd64.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  # =========================================================================
  # .rpm — Fedora, RHEL and openSUSE. Same reasoning as the .deb: build where
  # the Qt comes from, and let rpmbuild's soname scanner write the Requires.
  # linux-ci.yml's rpm job holds the same dependency install, build and the
  # two package steps below it, so a pull request proves them before a tag
  # does; both change together.
  # =========================================================================
  rpm:
    name: Build .rpm (Fedora)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    # DISH_RPM_IMAGE in scripts/tools.sh, the tag linux-ci.yml's rpm job uses.
    container: fedora:44
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: ./scripts/package-deps.sh rpm

      # Same rails as the .deb: scripts/build-rpm.sh drives the `package`
      # preset and swaps the cpack generator.
      - name: Build the .rpm
        env:
          DISH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./scripts/build-rpm.sh

      # Best effort: a symbol-upload hiccup must not fail a release.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/sentry-cli.sh symbols build-package

      # dnf refuses an unsigned package from the DNF repository, whose .repo
      # sets gpgcheck=1, so the .rpm is signed with the repository key before
      # it is hardened: the downloadable file and the repository's copy are
      # then the same bytes. linux-ci.yml's rpm job rehearses this step with
      # a throwaway key (scripts/check-rpm-signing.sh).
      - name: Sign the .rpm with the repository key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; the .rpm ships unsigned and rpm-publish skips."
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          ./packaging/repo/sign-rpm.sh dist/dish-[0-9]*.rpm

      # Payload, udev scriptlet, install and launch (with Qt's journald
      # logging sent back to stderr): the script linux-ci.yml's rpm job runs.
      - name: Check, install and launch the .rpm
        run: ./scripts/test-package.sh rpm

      # Stable-name copy for the /releases/latest/download/ permalink.
      - name: Stage stable-name alias
        run: cp dist/dish-*.x86_64.rpm dist/dish-x86_64.rpm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # AppImage — every other distro, including the LTS whose Qt is too old.
  # ubuntu-22.04, not 24.04: an AppImage's floor is the glibc it linked
  # against, and 22.04's 2.35 covers every currently-supported desktop.
  # =========================================================================
  appimage:
    name: Build AppImage
    needs: [gates, required-secrets]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Build tools, the xcb runtime, Qt and an SDL2 newer than jammy's: the
      # action appimage-ci.yml runs too, so the pull-request lane builds the
      # bundle a tag ships.
      - name: Set up the AppImage build host
        uses: ./.github/actions/setup-appimage-host

      # Everything fiddly — QML_SOURCES_PATHS, the icon basename, the offscreen
      # smoke test, the zsync update metadata — lives in the script so a local
      # build and CI agree.
      - name: Build AppImage
        env:
          # Empty for anything but a release from this repo: secrets are not
          # exposed to forks, so a fork build carries no DSN, cannot upload,
          # and skips building the SDK entirely.
          DISH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: scripts/build-appimage.sh

      # Best effort: a symbol-upload hiccup must not fail a release.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/sentry-cli.sh symbols build-appimage

      # Stable-name copy for the /releases/latest/download/ permalink.
      # No .zsync/.sha256 alias: AppImageUpdate matches the versioned
      # pattern, and SHA256SUMS covers the alias.
      - name: Stage stable-name alias
        run: cp dist/Dish-*-x86_64.AppImage dist/Dish-x86_64.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
          if-no-files-found: error

  # =========================================================================
  # Flatpak — the sandboxed build, and the artifact a Flathub PR is validated
  # against (docs/FLATHUB.md is the submission runbook). flatpak-builder is
  # driven directly so there is one fewer third-party action to pin and audit.
  # =========================================================================
  flatpak:
    name: Build Flatpak bundle
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install flatpak-builder
        run: |
          set -eux
          sudo apt-get update
          # elfutils: flatpak-builder shells out to eu-strip while finishing
          # a module, and the runner image does not carry it. librsvg2-common:
          # export validates the app icon with the host's gdk-pixbuf, and
          # without the SVG loader the scalable icon is "Format not
          # recognized".
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # The KDE runtime branch comes from scripts/tools.sh; the same script
      # flatpak-ci.yml runs on a pull request.
      - name: Build and export bundle
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-flatpak.sh "$TAG"
          # Stable-name copy for the /releases/latest/download/ permalink.
          cp "dist/Dish-${TAG}-x86_64.flatpak" dist/Dish-x86_64.flatpak

      # Best effort, like the package jobs. flatpak-builder strips the app
      # into /app/lib/debug while finishing the module, so the .debug files
      # under the build tree carry the build-id Sentry matches a crash to.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./scripts/sentry-cli.sh debug-tree build-flatpak/build/files/lib/debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # =========================================================================
  # latest.json — the update manifest.
  #
  # core/update/UpdateManifest.h fetches releases/latest/download/latest.json
  # and rejects anything whose product is not "dish-linux", whose channel is
  # not "stable", or whose minimumSupportedVersion is malformed or newer than
  # its version. This job is the only producer; the asset name never changes.
  # Without it the in-app update check 404s forever.
  #
  # Prerelease tags emit nothing: the permalink must keep serving stable
  # clients the last stable release's manifest.
  # =========================================================================
  manifest:
    name: Emit update manifest
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Write latest.json (stable tags only)
        id: emit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG}"
          case "${version}" in
            *-*)
              echo "::notice::Prerelease tag ${TAG}: skipping latest.json so the stable permalink keeps serving the last stable release."
              echo "stable=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '${TAG}' is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1 ;;
          esac

          # The drift that breaks every client at once: a manifest naming a
          # version the shipped binary does not report. DISH_VERSION comes from
          # project(Dish VERSION ...), so checking CMakeLists checks the binary.
          project_version="$(awk '/^project\(Dish/ { inproj = 1 }
                                  inproj && /^[[:space:]]*VERSION[[:space:]]/ { print $2; exit }' CMakeLists.txt)"
          [ "${project_version}" = "${version}" ] \
            || { echo "::error::tag ${TAG} but project(Dish VERSION) is ${project_version}"; exit 1; }

          min="$(python3 -c 'import json;print(json.load(open("packaging/update-policy.json"))["minimumSupportedVersion"])')"

          mkdir -p dist
          python3 - "$version" "$min" "$REPO" "$TAG" > dist/latest.json <<'PY'
          import json, sys, datetime
          version, minimum, repo, tag = sys.argv[1:5]
          print(json.dumps({
              "schema": 1,
              "product": "dish-linux",
              "version": version,
              "channel": "stable",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                                 .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "minimumSupportedVersion": minimum,
              "releaseNotesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
          }, indent=2))
          PY
          cat dist/latest.json
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.emit.outputs.stable == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-manifest
          path: dist/latest.json
          if-no-files-found: error

  # =========================================================================
  # harden: the shared reusable (scan, SBOMs, SHA256SUMS, cosign keyless).
  # Canonical copy: TinkerNorth/satellite/.github/workflows/_release_harden.yml
  # =========================================================================
  harden:
    name: Harden artifacts
    needs: [deb, rpm, appimage, flatpak, manifest]
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: linux-*
      product: dish

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-linux.intoto.jsonl
      upload-assets: false
      # A SHA-pinned call cannot resolve the prebuilt builder's release, so
      # the binary never downloads and the generator dies at exit 127; build
      # it from source instead.
      compile-generator: true

  draft:
    name: Upload the draft GitHub Release
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      # draft: true is load-bearing. GitHub never points releases/latest at a
      # draft, so the assets upload while the update permalink (latest.json)
      # and the AppImage zsync pattern still resolve to the previous release;
      # the flip below is what makes publication atomic for every client.
      - name: Upload to GitHub Releases (as draft)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          draft: true
          files: release/**/*
          fail_on_unmatched_files: true

  # The input-path measurements of the tagged commit, attached to the draft
  # with `gh release upload --clobber` before anything is published.
  measurements:
    name: Release measurements
    needs: [draft]
    permissions:
      contents: write
    uses: ./.github/workflows/measurements.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      upload_to_release: true
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish to GitHub Releases
    needs: [draft, measurements]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Flip release from draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = "false" ] || { echo "::error::release is still a draft"; exit 1; }

  sentry-release:
    name: Create the Sentry release
    needs: [publish]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release and associate commits
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/sentry-cli.sh release "$TAG"


  # =========================================================================
  # apt-publish: regenerate the APT repository at
  # https://tinkernorth.github.io/dish-linux/debian and commit to gh-pages.
  # Stable tags only; a prerelease must never reach package managers.
  # Skipped entirely if the GPG signing secret isn't set: unsigned repo
  # metadata is worse than no repo at all.
  # Ported from TinkerNorth/satellite release.yml; keep the two in step.
  # =========================================================================
  apt-publish:
    name: Publish APT repository (gh-pages)
    needs: [publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      # No persisted credential: this job pushes gh-pages, but through the
      # clone below that carries GITHUB_TOKEN itself, not through this checkout.
      - name: Checkout main (for build scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main
          persist-credentials: false

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping APT repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the repository tools
        if: steps.gate.outputs.skip != 'true'
        run: sudo main/scripts/package-deps.sh repos

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git -C main ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          else
            # First publish: initialize the orphan gh-pages branch with the
            # landing page and gpg.key already in place.
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . || true
            cp main/packaging/repo/index.html pages/index.html
          fi
          # Always refresh the landing page from main so README edits propagate.
          cp main/packaging/repo/index.html pages/index.html

      - name: Export public key as gpg.key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > pages/gpg.key

      - name: Build APT repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x main/packaging/repo/build-apt-repo.sh
          main/packaging/repo/build-apt-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No APT-repo changes to commit"
          else
            git commit -m "Publish APT repo: ${TAG}"
            git push origin gh-pages
          fi

  # =========================================================================
  # rpm-publish: same idea as apt-publish, but for the DNF/YUM tree
  # under https://tinkernorth.github.io/dish-linux/rpm.
  # =========================================================================
  rpm-publish:
    name: Publish DNF repository (gh-pages)
    needs: [publish, apt-publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      # No persisted credential: this job pushes gh-pages, but through the
      # clone below that carries GITHUB_TOKEN itself, not through this checkout.
      - name: Checkout main (for build scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main
          persist-credentials: false

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping DNF repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the repository tools
        if: steps.gate.outputs.skip != 'true'
        run: sudo main/scripts/package-deps.sh repos

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch (apt-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages

      - name: Build DNF repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          REPO_BASE_URL: "https://${{ github.repository_owner }}.github.io/dish-linux"
        run: |
          chmod +x main/packaging/repo/build-dnf-repo.sh
          main/packaging/repo/build-dnf-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No DNF-repo changes to commit"
          else
            git commit -m "Publish DNF repo: ${TAG}"
            git push origin gh-pages
          fi

  # =========================================================================
  # arch-publish: build the dish-bin pacman package from the in-tree
  # PKGBUILD (against the assets the publish job just made public) and
  # regenerate the signed pacman repository under
  # https://tinkernorth.github.io/dish-linux/arch/x86_64.
  #
  # A self-hosted pacman repo, not the AUR: AUR registration is closed, and
  # a binary repo is CI-automatable where AUR pushes need a personal SSH
  # key. packaging/aur/ stays AUR-ready for if/when registration reopens.
  # Chained after rpm-publish because both jobs push gh-pages.
  # =========================================================================
  arch-publish:
    name: Publish pacman repository (gh-pages)
    needs: [publish, rpm-publish]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # DISH_ARCH_IMAGE in scripts/tools.sh, the tag linux-ci.yml's arch lane uses.
    container: archlinux:base-devel-20261108.0.623074
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping pacman repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No persisted credential: this job pushes gh-pages, but through the
      # clone below that carries GITHUB_TOKEN itself, not through this checkout.
      - name: Checkout main (for the PKGBUILD and the scripts)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main
          persist-credentials: false

      - name: Install tooling
        if: steps.gate.outputs.skip != 'true'
        run: main/scripts/package-deps.sh arch

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      # updpkgsums re-downloads the sources from the release the publish job
      # just flipped live, so the repository package is built from (and
      # checksummed against) the published bytes. linux-ci.yml's arch lane
      # runs the same script on every pull request with a local AppImage.
      - name: Build dish-bin package
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: main/scripts/build-arch-package.sh "$TAG"

      - name: Check out gh-pages branch (rpm-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages

      # Signs each package, adds it to the signed database and replaces
      # repo-add's symlinks with copies (Pages serves no symlinks).
      - name: Build pacman repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: main/packaging/repo/build-pacman-repo.sh "$(pwd)/pages" "$(pwd)/main/dist/arch"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No pacman-repo changes to commit"
          else
            git commit -m "Publish pacman repo: ${TAG}"
            git push origin gh-pages
          fi
