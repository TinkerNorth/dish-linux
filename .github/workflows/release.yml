name: Release

on:
  push:
    # Bare MAJOR.MINOR.PATCH tags, no v prefix — org convention for the
    # product repos, because dish-android's pipeline requires bare tags.
    # (Releases were previously v-prefixed; every version consumer below
    # tolerates a legacy v by stripping it.)
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

# Packages a tagged commit four ways — .deb (Debian 13+), .rpm (Fedora/RHEL/
# openSUSE), AppImage (everything else, including an LTS whose Qt is below the
# floor) and a Flatpak bundle — emits the latest.json the in-app update check
# reads, and uploads the lot to the GitHub Releases page for the tag. Stable
# tags then regenerate the GPG-signed APT and DNF repositories on gh-pages
# (tinkernorth.github.io/dish-linux) so package managers pull the update.
#
# The .deb and .rpm jobs install their own package and launch it before
# uploading. That is the only gate that can catch a missing runtime dependency:
# every other check passes against a build tree, which is exactly where a QML
# module resolves from the Qt install instead of from a Depends: line.
#
# Before any artifact is uploaded the `gates` job re-runs every PR-time
# check (action-pin lint, allowlist expiry, OSV-Scanner, gitleaks)
# against the tagged commit. The `harden` job (the shared
# _release_harden.yml) then scans, signs (cosign keyless), generates SBOMs,
# and produces SHA256SUMS.
#
# The release is uploaded as a DRAFT and flipped to published afterwards:
# GitHub never points releases/latest at a draft, so the update permalink
# (latest.json) and the AppImage's zsync pattern both keep resolving to the
# previous release until every asset of the new one is in place.
#
# Prerelease tags (1.2.3-rc.1) publish marked as prerelease, skip
# latest.json, and skip the APT/DNF repos — stable clients and repos never
# see them.
#
# Linux binaries are not signed with a platform key by default; the
# `required-secrets` gate therefore enforces only that the cosign keyless
# flow is reachable (id-token: write).
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v7.0.0  → 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/upload-artifact         @ v7.0.1  → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact       @ v8.0.1  → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   softprops/action-gh-release     @ v3.0.2  → 3d0d9888cb7fd7b750713d6e236d1fcb99157228
#   slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml
#                                   @ v2.1.0  → f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
#   (scan/SBOM/cosign pins live in _release_harden.yml)

# Least privilege at the top; each job widens only what it needs. A workflow
# grant is a ceiling for the jobs AND for any reusable workflow they call, so
# `contents: write` here would have left `gates` unable to request the
# security-events scope _security.yml declares.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: PR-time gates against tag
    # Must be a superset of _security.yml's own permissions block: a called
    # workflow asking for more than the caller holds fails the run outright.
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: |
        .
      gitleaks_enabled: true
      dependency_review_enabled: false
      action_pin_lint_enabled: true
      allowlist_expiry_enabled: true

  required-secrets:
    name: Required release secrets gate
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Verify cosign keyless OIDC is reachable for tagged releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] || ! [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::Non-release-tag run — cosign keyless gate is advisory."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::id-token: write permission missing — cosign keyless signing cannot proceed."
            exit 1
          fi
          echo "id-token write permission present; cosign keyless flow can authenticate."

      - name: Report APT/DNF repo signing readiness (advisory)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set — the apt-publish and rpm-publish jobs will skip, and package-manager users will not see this release."
          else
            echo "GPG repo-signing secrets present; APT/DNF repos will be regenerated."
          fi

  # =========================================================================
  # .deb — Debian 13 and derivatives.
  #
  # In a debian:trixie container against the DISTRO's Qt (6.8, above the 6.7
  # floor), not the aqtinstall Qt the other jobs use: dpkg-shlibdeps reads the
  # built binary's DT_NEEDED set to compute Depends, and a binary linked
  # against a Qt no Debian ships produces a package that resolves on nothing.
  # Ubuntu 24.04 LTS is deliberately not a .deb target — its Qt is 6.4.2, below
  # the floor. The AppImage and the Flatpak are the answer there.
  # =========================================================================
  deb:
    name: Build .deb (Debian 13)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          cat > /etc/apt/apt.conf.d/99-dish-acquire <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
          CONF
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libsodium-dev libsdl2-dev libdbus-1-dev \
            dpkg-dev fakeroot file gzip \
            librsvg2-bin desktop-file-utils appstream lintian

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate desktop entry and AppStream metadata
        run: |
          set -euo pipefail
          desktop-file-validate packaging/dish.desktop
          appstreamcli validate --no-net packaging/com.tinkernorth.Dish.metainfo.xml

      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDISH_BUILD_TESTS=OFF
          cmake --build build-release --parallel

      - name: Package
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -G DEB -B build-release/packages
          mkdir -p dist && cp build-release/packages/*.deb dist/

      - name: lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Assert package contents
        run: |
          set -euo pipefail
          contents="$(dpkg-deb -c dist/*.deb)"
          for path in \
            ./usr/bin/dish \
            ./usr/lib/udev/rules.d/70-dish-hidraw.rules \
            ./usr/share/applications/com.tinkernorth.Dish.desktop \
            ./usr/share/metainfo/com.tinkernorth.Dish.metainfo.xml \
            ./usr/share/icons/hicolor/scalable/apps/com.tinkernorth.Dish.svg \
            ./usr/share/doc/dish/copyright
          do
            grep -qE " ${path}\$" <<<"${contents}" \
              || { echo "::error::${path} missing from the .deb"; exit 1; }
          done
          icon="$(sed -n 's/^Icon=//p' packaging/dish.desktop)"
          grep -q "/apps/${icon}\." <<<"${contents}" \
            || { echo "::error::Icon=${icon} names no installed icon"; exit 1; }

      # Nothing else can stand in for this. Unit tests, lints and a contents
      # check all pass against a build tree, and a build tree is exactly what
      # hides a missing runtime dependency: a QML module resolves from the Qt
      # install during development and from a Depends: line afterwards.
      - name: Install the package and launch it
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          export QT_QPA_PLATFORM=offscreen
          export XDG_RUNTIME_DIR=/tmp/dish-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          # The SVG handler is a run-time plugin, so its absence shows up as
          # "Unsupported image format" per glyph rather than as a link error.
          echo "--- Qt image-format plugins ---"
          ls -1 /usr/lib/*/qt6/plugins/imageformats/ 2>/dev/null || echo "(no imageformats directory)"
          dpkg -S /usr/lib/*/qt6/plugins/imageformats/libqsvg.so 2>/dev/null \
            || echo "libqsvg.so is absent — no package here provides it"
          # Signalled by hand rather than through `timeout`, which reports 124
          # whether the child shut down cleanly or had to be killed — the one
          # distinction this step exists to make. Every wait below is bounded,
          # because an unbounded one is how this step once sat for 40 minutes
          # and took the job's timeout with it.
          set +e
          dish >/tmp/launch.log 2>&1 &
          app=$!
          sleep 20
          started=0
          kill -0 "$app" 2>/dev/null && started=1
          needed_kill=0
          if [ "$started" = 1 ]; then
            kill -TERM "$app"
            waited=0
            while [ "$waited" -lt 15 ] && kill -0 "$app" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$app" 2>/dev/null; then
              kill -KILL "$app"
              needed_kill=1
            fi
          fi
          wait "$app"
          rc=$?
          set -e
          cat /tmp/launch.log
          if grep -qE 'is not installed|failed to load component|Cannot load library|no such file' /tmp/launch.log; then
            echo "::error::the installed package cannot load its Qt/QML runtime"
            exit 1
          fi
          # Fatal: the app renders no iconography at all when this fires, and
          # the only symptom is a log flood nobody reads. It stayed a warning
          # only until the Depends: line was right.
          if grep -q 'Error decoding:' /tmp/launch.log; then
            echo "::error::the installed app cannot decode its brand SVGs — the Qt SVG image plugin is missing or unloadable"
            exit 1
          fi
          if [ "$started" != 1 ]; then
            echo "::error::dish exited on its own (${rc}) instead of staying up"
            exit 1
          fi
          # SIGTERM is what a logout sends. Ignoring it means ~AppModel never
          # runs, so the input thread is not stopped and QSettings never writes
          # what the session changed.
          if [ "$needed_kill" = 1 ]; then
            echo "::error::dish did not exit on SIGTERM; it needed SIGKILL"
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::dish shut down on SIGTERM but exited ${rc}"
            exit 1
          fi
          echo "::notice::dish came up, shut down on SIGTERM and exited 0"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  # =========================================================================
  # .rpm — Fedora, RHEL and openSUSE. Same reasoning as the .deb: build where
  # the Qt comes from, and let rpmbuild's soname scanner write the Requires.
  # =========================================================================
  rpm:
    name: Build .rpm (Fedora)
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    container: fedora:42
    timeout-minutes: 45
    # A container job's default shell is `sh`, which has neither `<<<` nor
    # `pipefail`; every step here assumes bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and packaging dependencies
        run: |
          set -eux
          dnf -y install --setopt=install_weak_deps=False \
            git-core ca-certificates \
            gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel qt6-qttools-devel \
            libsodium-devel SDL2-devel dbus-devel \
            librsvg2-tools desktop-file-utils libappstream-glib gzip

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure and build
        run: |
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDISH_BUILD_TESTS=OFF
          cmake --build build-release --parallel

      - name: Package
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -G RPM -B build-release/packages
          mkdir -p dist && cp build-release/packages/*.rpm dist/

      - name: Assert package contents and scriptlets
        run: |
          set -euo pipefail
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm
          # Without the reload a pad plugged in before the install keeps its
          # root-only node and every USB-direct claim fails.
          rpm -qp --scripts dist/*.rpm | grep -q 'udevadm control' \
            || { echo "::error::rpm carries no udev reload scriptlet"; exit 1; }
          rpm -qlp dist/*.rpm | grep -qx '/usr/lib/udev/rules.d/70-dish-hidraw.rules' \
            || { echo "::error::udev rule missing or at the wrong path"; exit 1; }

      - name: Install the package and launch it
        run: |
          set -euo pipefail
          dnf -y install ./dist/*.rpm
          export QT_QPA_PLATFORM=offscreen
          export XDG_RUNTIME_DIR=/tmp/dish-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          # The SVG handler is a run-time plugin, so its absence shows up as
          # "Unsupported image format" per glyph rather than as a link error.
          echo "--- Qt image-format plugins ---"
          ls -1 /usr/lib/*/qt6/plugins/imageformats/ 2>/dev/null || echo "(no imageformats directory)"
          dpkg -S /usr/lib/*/qt6/plugins/imageformats/libqsvg.so 2>/dev/null \
            || echo "libqsvg.so is absent — no package here provides it"
          # Signalled by hand rather than through `timeout`, which reports 124
          # whether the child shut down cleanly or had to be killed — the one
          # distinction this step exists to make. Every wait below is bounded,
          # because an unbounded one is how this step once sat for 40 minutes
          # and took the job's timeout with it.
          set +e
          dish >/tmp/launch.log 2>&1 &
          app=$!
          sleep 20
          started=0
          kill -0 "$app" 2>/dev/null && started=1
          needed_kill=0
          if [ "$started" = 1 ]; then
            kill -TERM "$app"
            waited=0
            while [ "$waited" -lt 15 ] && kill -0 "$app" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$app" 2>/dev/null; then
              kill -KILL "$app"
              needed_kill=1
            fi
          fi
          wait "$app"
          rc=$?
          set -e
          cat /tmp/launch.log
          if grep -qE 'is not installed|failed to load component|Cannot load library|no such file' /tmp/launch.log; then
            echo "::error::the installed package cannot load its Qt/QML runtime"
            exit 1
          fi
          # Fatal: the app renders no iconography at all when this fires, and
          # the only symptom is a log flood nobody reads. It stayed a warning
          # only until the Depends: line was right.
          if grep -q 'Error decoding:' /tmp/launch.log; then
            echo "::error::the installed app cannot decode its brand SVGs — the Qt SVG image plugin is missing or unloadable"
            exit 1
          fi
          if [ "$started" != 1 ]; then
            echo "::error::dish exited on its own (${rc}) instead of staying up"
            exit 1
          fi
          # SIGTERM is what a logout sends. Ignoring it means ~AppModel never
          # runs, so the input thread is not stopped and QSettings never writes
          # what the session changed.
          if [ "$needed_kill" = 1 ]; then
            echo "::error::dish did not exit on SIGTERM; it needed SIGKILL"
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::dish shut down on SIGTERM but exited ${rc}"
            exit 1
          fi
          echo "::notice::dish came up, shut down on SIGTERM and exited 0"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # AppImage — every other distro, including the LTS whose Qt is too old.
  # ubuntu-22.04, not 24.04: an AppImage's floor is the glibc it linked
  # against, and 22.04's 2.35 covers every currently-supported desktop.
  # =========================================================================
  appimage:
    name: Build AppImage
    needs: [gates, required-secrets]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          set -eux
          sudo tee /etc/apt/apt.conf.d/99-dish-acquire >/dev/null <<'CONF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "2";
          CONF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsodium-dev libsdl2-dev \
            file fakeroot rsync wget curl librsvg2-bin gzip

      # Not apt: jammy ships Qt 6.2 and this project's floor is 6.7. The action
      # pulls the official binaries, exports CMAKE_PREFIX_PATH, and puts qmake
      # on PATH where linuxdeploy-plugin-qt looks for it.
      - name: Set up Qt
        uses: ./.github/actions/setup-qt

      # Everything fiddly — QML_SOURCES_PATHS, the icon basename, the offscreen
      # smoke test, the zsync update metadata — lives in the script so a local
      # build and CI agree.
      - name: Build AppImage
        run: scripts/build-appimage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
          if-no-files-found: error

  # =========================================================================
  # Flatpak — the sandboxed build, and the artifact a Flathub PR is validated
  # against (docs/FLATHUB.md is the submission runbook). flatpak-builder is
  # driven directly so there is one fewer third-party action to pin and audit.
  # =========================================================================
  flatpak:
    name: Build Flatpak bundle
    needs: [gates, required-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install flatpak-builder
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder ca-certificates
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stage version
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and export bundle
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --repo=build-flatpak/repo build-flatpak/build \
            packaging/flatpak/com.tinkernorth.Dish.yml
          mkdir -p dist
          flatpak build-bundle build-flatpak/repo \
            "dist/Dish-${{ steps.ver.outputs.version }}-x86_64.flatpak" \
            com.tinkernorth.Dish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # =========================================================================
  # latest.json — the update manifest.
  #
  # core/update/UpdateManifest.h fetches releases/latest/download/latest.json
  # and rejects anything whose product is not "dish-linux", whose channel is
  # not "stable", or whose minimumSupportedVersion is malformed or newer than
  # its version. This job is the only producer; the asset name never changes.
  # Without it the in-app update check 404s forever.
  #
  # Prerelease tags emit nothing: the permalink must keep serving stable
  # clients the last stable release's manifest.
  # =========================================================================
  manifest:
    name: Emit update manifest
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Write latest.json (stable tags only)
        id: emit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "${version}" in
            *-*)
              echo "::notice::Prerelease tag ${TAG}: skipping latest.json so the stable permalink keeps serving the last stable release."
              echo "stable=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '${TAG}' is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1 ;;
          esac

          # The drift that breaks every client at once: a manifest naming a
          # version the shipped binary does not report. DISH_VERSION comes from
          # project(Dish VERSION ...), so checking CMakeLists checks the binary.
          project_version="$(awk '/^project\(Dish/ { inproj = 1 }
                                  inproj && /^[[:space:]]*VERSION[[:space:]]/ { print $2; exit }' CMakeLists.txt)"
          [ "${project_version}" = "${version}" ] \
            || { echo "::error::tag ${TAG} but project(Dish VERSION) is ${project_version}"; exit 1; }

          min="$(python3 -c 'import json;print(json.load(open("packaging/update-policy.json"))["minimumSupportedVersion"])')"

          mkdir -p dist
          python3 - "$version" "$min" "$REPO" "$TAG" > dist/latest.json <<'PY'
          import json, sys, datetime
          version, minimum, repo, tag = sys.argv[1:5]
          print(json.dumps({
              "schema": 1,
              "product": "dish-linux",
              "version": version,
              "channel": "stable",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc)
                                 .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "minimumSupportedVersion": minimum,
              "releaseNotesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
          }, indent=2))
          PY
          cat dist/latest.json
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.emit.outputs.stable == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-manifest
          path: dist/latest.json
          if-no-files-found: error

  # =========================================================================
  # harden — the shared reusable (scan, SBOMs, SHA256SUMS, cosign keyless).
  # Canonical copy: TinkerNorth/satellite/.github/workflows/_release_harden.yml
  # =========================================================================
  harden:
    name: Harden artifacts
    needs: [deb, rpm, appimage, flatpak, manifest]
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_release_harden.yml
    with:
      artifact-pattern: linux-*
      product: dish

  provenance:
    name: SLSA L3 provenance
    needs: [harden]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.harden.outputs.hashes }}
      provenance-name: dish-linux.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish to GitHub Releases
    needs: [harden, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download hardened bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release

      - name: Show what we're about to publish
        run: find release -type f -printf '%p\n'

      # draft: true is load-bearing. GitHub never points releases/latest at a
      # draft, so the assets upload while the update permalink (latest.json)
      # and the AppImage zsync pattern still resolve to the previous release;
      # the flip below is what makes publication atomic for every client.
      - name: Upload to GitHub Releases (as draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          draft: true
          files: release/**/*
          fail_on_unmatched_files: true

      - name: Flip release from draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$draft" = "false" ] || { echo "::error::release is still a draft"; exit 1; }

  # =========================================================================
  # apt-publish: regenerate the APT repository at
  # https://tinkernorth.github.io/dish-linux/debian and commit to gh-pages.
  # Stable tags only — a prerelease must never reach package managers.
  # Skipped entirely if the GPG signing secret isn't set: unsigned repo
  # metadata is worse than no repo at all.
  # Ported from TinkerNorth/satellite release.yml; keep the two in step.
  # =========================================================================
  apt-publish:
    name: Publish APT repository (gh-pages)
    needs: [publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout main (for build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping APT repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install apt-utils + GPG
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git -C main ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          else
            # First publish: initialize the orphan gh-pages branch with the
            # landing page and gpg.key already in place.
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . || true
            cp main/packaging/repo/index.html pages/index.html
          fi
          # Always refresh the landing page from main so README edits propagate.
          cp main/packaging/repo/index.html pages/index.html

      - name: Export public key as gpg.key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > pages/gpg.key

      - name: Build APT repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          chmod +x main/packaging/repo/build-apt-repo.sh
          main/packaging/repo/build-apt-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No APT-repo changes to commit"
          else
            git commit -m "Publish APT repo: ${TAG}"
            git push origin gh-pages
          fi

  # =========================================================================
  # rpm-publish: same idea as apt-publish, but for the DNF/YUM tree
  # under https://tinkernorth.github.io/dish-linux/rpm.
  # =========================================================================
  rpm-publish:
    name: Publish DNF repository (gh-pages)
    needs: [publish, apt-publish]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout main (for build scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping DNF repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install createrepo_c + GPG
        if: steps.gate.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends createrepo-c gnupg

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download release bundle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Check out gh-pages branch (apt-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages

      - name: Build DNF repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          REPO_BASE_URL: "https://${{ github.repository_owner }}.github.io/dish-linux"
        run: |
          chmod +x main/packaging/repo/build-dnf-repo.sh
          main/packaging/repo/build-dnf-repo.sh "$(pwd)/pages" "$(pwd)/release"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No DNF-repo changes to commit"
          else
            git commit -m "Publish DNF repo: ${TAG}"
            git push origin gh-pages
          fi

  # =========================================================================
  # arch-publish: build the dish-bin pacman package from the in-tree
  # PKGBUILD (against the assets the publish job just made public) and
  # regenerate the signed pacman repository under
  # https://tinkernorth.github.io/dish-linux/arch/x86_64.
  #
  # A self-hosted pacman repo, not the AUR: AUR registration is closed, and
  # a binary repo is CI-automatable where AUR pushes need a personal SSH
  # key. packaging/aur/ stays AUR-ready for if/when registration reopens.
  # Chained after rpm-publish because both jobs push gh-pages.
  # =========================================================================
  arch-publish:
    name: Publish pacman repository (gh-pages)
    needs: [publish, rpm-publish]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: write
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate on GPG signing secret
        id: gate
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_KEY_ID not set; skipping pacman repo publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tooling
        if: steps.gate.outputs.skip != 'true'
        run: pacman -Syu --noconfirm git pacman-contrib

      - name: Checkout main (for the PKGBUILD)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: main

      - name: Import signing key
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      # makepkg refuses to run as root, and the container runs as root:
      # build as a throwaway user. updpkgsums re-downloads the sources from
      # the release the publish job just flipped live, so the repo package
      # is built from (and checksummed against) the published bytes, not a
      # parallel local copy. -d skips dependency checks: a -bin package()
      # only copies files, and fuse2/hicolor are runtime deps.
      - name: Build dish-bin package
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          useradd -m builder
          builddir=/home/builder/dish-bin
          mkdir -p "$builddir"
          cp main/packaging/aur/PKGBUILD main/packaging/aur/dish-bin.install "$builddir/"
          sed -i "s/^pkgver=.*/pkgver=${version}/; s/^pkgrel=.*/pkgrel=1/" "$builddir/PKGBUILD"
          chown -R builder:builder "$builddir"
          su builder -c "cd '$builddir' && updpkgsums && PACKAGER='dish-release-bot <releases@tinkernorth.invalid>' makepkg -d --noconfirm"
          ls -l "$builddir"/*.pkg.tar.zst

      - name: Sign package
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for pkg in /home/builder/dish-bin/*.pkg.tar.zst; do
            gpg --batch --yes --default-key "$GPG_KEY_ID" --detach-sign "$pkg"
          done

      - name: Check out gh-pages branch (rpm-publish has already touched it)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages

      # repo-add emits dish.db / dish.files as symlinks to the .tar.gz
      # files; GitHub Pages does not serve symlinks, so replace each with a
      # real copy before committing.
      - name: Build pacman repo
        if: steps.gate.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          repo_dir=pages/arch/x86_64
          mkdir -p "$repo_dir"
          cp /home/builder/dish-bin/*.pkg.tar.zst /home/builder/dish-bin/*.pkg.tar.zst.sig "$repo_dir/"
          (
            cd "$repo_dir"
            repo-add --sign --key "$GPG_KEY_ID" dish.db.tar.gz ./*.pkg.tar.zst
            for link in $(find . -maxdepth 1 -type l); do
              target="$(readlink -f "$link")"
              rm "$link"
              cp "$target" "$link"
            done
          )
          ls -l "$repo_dir"

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd pages
          git config user.name  'dish-release-bot'
          git config user.email 'releases@tinkernorth.invalid'
          git add -A
          if git diff --cached --quiet; then
            echo "No pacman-repo changes to commit"
          else
            git commit -m "Publish pacman repo: ${TAG}"
            git push origin gh-pages
          fi
