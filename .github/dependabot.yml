version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only. The composite actions pin their own
    # `uses:` lines (actions/cache in both), and those sat two majors behind
    # the workflows, into a Node 20 deprecation notice on every job, until
    # their directories were listed here too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    # One PR per week for every action bump together (the way dish-android's
    # arrive): the bumps are independent one-liners, and with "require branches
    # to be up to date" on main, N separate PRs cost N full CI cycles.
    groups:
      github-actions:
        patterns:
          - "*"
